# 意图识别（text-only）：轻量文本分类，无需 thinking/reasoning。
# thinking_type=auto + reasoning_effort=none → 不发送 thinking 参数，
# 避免全局 adaptive 设置被 doubao 等 provider 拒绝。
intent_recognition:
  provider: doubao
  model: doubao-seed-2-1-pro-260628
  prompt_version: v1
  enable_preprocessing: false
  reasoning_effort: none
  thinking_type: auto

