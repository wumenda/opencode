llm:
  max_tokens: 32768
  max_retries: 3
  connect_timeout: 60
  timeout: 600
  max_image_size: 4096
  max_image_pixels: 36000000
  stream: true
  temperature: 0.3
  top_p: null
  seed: 42
  response_format:
    type: text

features:
  inject_image_size: true
  keep_temp_files: false
  save_thinking: true
  thinking_output_dir: thinking_output
  enable_prefix_caching: false
  thinking_type: adaptive

ocr_matching:
  equipment_proximity_threshold: 0.12
  cross_drawing_search_radius: 0.18
  cross_drawing_bbox_expansion: 0.04
  boundary_proximity_threshold: 0.15

parallel:
  # 设备节点 + 边界节点提取并行数（1 = 串行，>1 = 并行）
  node_extraction_workers: 1
  # 多页 PDF 图纸提取并行数（1 = 按页串行，>1 = 多页并行）
  multi_page_workers: 5
