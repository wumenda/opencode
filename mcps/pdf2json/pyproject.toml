[project]
name = "pfd-topology-extractor"
version = "1.0.0"
description = "PFD图纸设备拓扑提取智能体"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PFD Analysis Team"}
]
keywords = ["pfd", "ocr", "topology", "chemical-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.30.0",
    "pymupdf>=1.23.0",
    "pypdfium2>=4.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "cachetools>=5.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.0.0",
    "click>=8.0.0",
    "mcp>=1.0.0",
    "fastmcp==3.4.5",
    "openpyxl>=3.1.5",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0"
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "mcp_server"]

[tool.uv]
managed = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "playwright>=1.60.0",
    "pytest-asyncio>=1.4.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"entry/**/*.py" = ["E402"]
"interface/mcp/server.py" = ["E402"]
"utils/convert_pdf.py" = ["E402"]
